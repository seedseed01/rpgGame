# fly.toml app configuration file generated for rpggame on 2026-08-14T23:19:47+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rpggame'
primary_region = 'nrt'

# 新增下面這兩行，讓 Fly.io 用 .NET 官方建置包自動編譯！
[build]
  builder = "paketobuildpacks/builder:base"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[mounts]
  source = "rpg_data"
  destination = "/app/data"